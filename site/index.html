<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Foot</title>
<style>
:root{--o:#1b3a73;--or:#e8b923;--bg:#eef3fa;--t:#222;--c:#fff;--g:#777}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;z-index:50;box-shadow:0 2px 6px #0003;background:var(--o);border-bottom:4px solid var(--or);color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0 auto 0 0}
nav button{background:#fff3;color:#fff;border:0;padding:8px 14px;border-radius:6px;font-size:15px;margin-left:4px}
nav button.on{background:#fff;color:var(--o);font-weight:700}
main{max-width:1150px;margin:auto;padding:12px}
.filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button{font:inherit;padding:7px;border:1px solid #ccc;border-radius:6px;background:#fff}
button{cursor:pointer}
.fiche{background:var(--c);border-left:6px solid var(--o);border-radius:8px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.fiche h3{margin:0 0 4px;color:var(--o);text-transform:uppercase;font-size:17px}
.tags .tclub{background:var(--or);font-weight:700}.tags .tperso{background:#eee;color:#555}#clubetat{font-size:13px;color:var(--g);margin:0 0 6px}
.tags span{display:inline-block;background:#dce8f8;color:#1b3a73;border-radius:10px;padding:1px 9px;font-size:13px;margin:0 4px 4px 0}
.min{display:inline-block;background:var(--or);color:#1b3a73;border-radius:50%;padding:6px 8px;font-weight:700;font-size:13px;margin-right:6px}
.fiche h4{margin:10px 0 2px;font-size:14px;text-transform:uppercase;color:var(--g)}
.fiche p,.fiche ul{margin:2px 0}.fiche ul{padding-left:20px}
details summary{cursor:pointer;color:var(--o);margin-top:8px}
.actions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.add{background:var(--or);color:#1b3a73;font-weight:700;border-color:var(--or)}.add0{background:var(--o);color:#fff;border-color:var(--o)}
.tot{background:#fff;border-radius:8px;padding:10px;margin-bottom:12px;font-weight:600}
.vide{color:var(--g);text-align:center;padding:30px}
.hide{display:none}#props:empty{display:none}#props{background:#fff;border-radius:8px;padding:8px}#tbar span{color:var(--g)}.layout{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}#side{position:sticky;top:70px;max-height:calc(100vh - 80px);overflow-y:auto;background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px #0002}#side input{width:100%;margin-bottom:8px}#side summary{cursor:pointer;font-weight:700;color:var(--o);padding:6px 0;text-transform:uppercase;font-size:13px}.fo{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px}.fo:hover{background:#eef3fa}.fo.on{background:var(--o);color:#fff}.fo small{opacity:.6}@media(max-width:700px){.layout{grid-template-columns:1fr}#side{position:static;max-height:260px}}.form{display:flex;flex-direction:column;gap:8px;min-width:min(520px,85vw)}.form label{display:flex;flex-direction:column;font-size:13px;color:var(--g)}.form textarea,.form input,.form select{font:inherit;color:#222}#tabD.on,#tabM.on,#tabV.on,#tbar button.on{background:var(--o);color:#fff}.pl{margin-top:4px;font-size:13px}.sch{max-width:420px;margin:8px 0}.sch svg{width:100%;height:auto;display:block}
.tstep{background:#fff;border-radius:8px;margin-bottom:10px;box-shadow:0 1px 3px #0002}.tstep>summary{font-size:18px;font-weight:700;color:var(--o);padding:14px;list-style:none;display:flex;gap:10px;align-items:center}.tstep>summary::-webkit-details-marker{display:none}.tstep .fiche{box-shadow:none;margin:0;border-left:0}.tstep .fiche h3{display:none}.tstep>summary .d{margin-left:auto;background:var(--or);border-radius:14px;padding:2px 12px}.sitem{background:#fff;border-left:6px solid var(--or);border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002}.sitem h3{margin:0 0 4px;color:var(--o)}.sitem small{color:var(--g)}.timer{display:flex;gap:8px;align-items:center;padding:0 14px 10px}.timer b{font-size:32px;font-variant-numeric:tabular-nums;color:var(--o);margin-right:auto}.timer button{font-size:18px;padding:10px 16px}.timer.fin{background:#c0392b;color:#fff;border-radius:8px;margin:0 8px 8px;padding:10px}.timer.fin b{color:#fff}.terrain .noprint>*:not(#mt){display:none!important}.terrain #sl .noprint{display:none!important}.terrain .tot{position:sticky;top:60px;z-index:5}@media(max-width:700px){main{padding:8px}.layout{display:block}#side{position:static;max-height:none}}
#editeur{max-width:760px;margin:auto}#editeur .hide{display:none!important}.edtitre{margin:0 0 6px;color:var(--g);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}.steps button{padding:10px 4px;font-weight:600;border-color:var(--o);color:var(--o)}.steps button.on{background:var(--o);color:#fff}
.pal{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;-webkit-overflow-scrolling:touch}@media(min-width:701px){.pal{flex-wrap:wrap}}.pal button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:6px 6px 4px;font-size:12px}.pal button.on{background:#fff4d0;border:2px solid var(--or);box-shadow:0 0 0 2px var(--o) inset}
.hint{background:#fff;border-left:4px solid var(--or);border-radius:6px;padding:6px 10px;margin:6px 0;font-size:13px;color:#444}
#editeur .sch{max-width:none;margin:0;background:#fff;border-radius:8px}#editeur #props{margin-top:6px;font-size:14px;box-shadow:0 1px 3px #0002}#editeur button{min-height:40px}#editeur button:disabled{opacity:.4}
.big{font-size:17px;padding:10px 18px;width:100%}.del{color:#c0392b;border-color:#e3b0aa}.pastille{width:34px;min-height:34px!important;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #999}.pastille.on{box-shadow:0 0 0 3px var(--or)}.vide0{color:var(--g)}
.opts{border-top:1px solid #d5deea;padding-top:8px;margin-top:12px;font-size:14px}.opts input{padding:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.chip{flex-direction:row!important;align-items:center;gap:4px;background:#fff;border:1px solid #ccc;border-radius:16px;padding:4px 10px;color:#222!important}
dialog{max-height:92vh;overflow:auto;border:0;border-radius:10px;box-shadow:0 4px 20px #0005}@media(max-width:700px){dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:10px 10px 0 0}.form{min-width:0}.steps button{font-size:13px}}
.schs{display:flex;gap:10px;margin:8px 0;max-width:420px}.schs.multi{max-width:none;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.schs .sch{flex:1 0 300px;max-width:420px;margin:0;scroll-snap-align:start;background:#f7f9fc;border-radius:8px;padding:6px;border:2px solid transparent}.schs .sch.on{border-color:var(--or)}.schs figcaption{font-size:14px;color:var(--o);margin:0 0 4px}.schs figcaption:empty{display:none}.vt{background:#dce8f8;border-radius:10px;padding:0 8px;font-size:12px;color:var(--o)}.schs .actions{margin-top:4px}@media(max-width:700px){.schs .sch{flex-basis:85%}}
@media print{header,.filtres,.actions,.noprint{display:none!important}body{background:#fff}.fiche{box-shadow:none;break-inside:avoid;border:1px solid #999}@page{size:A4;margin:12mm}}
</style></head><body>
<header><h1>⚽ Atelier Foot · ESGA</h1>
<nav><button id="nf">Faire une séance</button><button id="nb" class="on">Base</button><button id="nl">Séances</button><button id="ns">Séance (<span id="cnt">0</span>)</button><button id="ne">Éditeur</button></nav></header>
<main>
<section id="base">
 <div class="layout"><aside id="side"></aside><div>
 <div id="clubetat"></div><div id="liste"></div></div></div>
</section>
<section id="seance" class="hide">
 <div class="actions noprint">
  <input id="nom" placeholder="Nom de la séance"><input id="dat" type="date" title="Date de la séance">
  <button id="sv" class="add">Enregistrer au club</button><button id="mt">📱 Mode terrain</button>
  <button id="cln">⧉ Nouvelle séance à partir de celle-ci</button><button id="exp">Exporter</button>
  <label><button onclick="imp.click()">Importer</button><input type="file" id="imp" class="hide" accept=".json"></label>
  <button onclick="print()">Imprimer</button><button id="raz">Vider</button>
 </div>
 <div class="tot" id="tot"></div><div id="sl"></div>
</section>
<section id="seances" class="hide">
 <div class="filtres noprint"><input id="sq" placeholder="Rechercher une séance…"><select id="sa"><option value="">Tous les entraîneurs</option></select><button id="sr" onclick="seancesCharger()">Actualiser</button><label class="fo" style="cursor:pointer;padding:7px;border:1px solid #ccc;border-radius:6px;background:#fff">Importer des séances (.json)<input type="file" accept=".json" multiple class="hide" onchange="importerSeances(this.files)"></label></div>
 <div id="sle"></div>
</section>
<section id="editeur" class="hide">
 <p id="edtitre" class="edtitre"></p>
 <div class="steps"><button id="tabD" class="on">① Placer</button><button id="tabM">② Bouger</button><button id="tabV">③ Voir</button><button id="save">④ Fiche</button></div>
 <div id="tools" class="pal noprint"></div>
 <div id="tbar" class="actions hide"></div>
 <div id="visbar" class="actions hide"><button id="vpause">⏸ Pause</button><button id="vrestart">↻ Recommencer</button><label>Vitesse <select id="vspeed"><option value="0.5">× 0,5</option><option value="1" selected>× 1</option><option value="2">× 2</option></select></label></div>
 <p id="hint" class="hint"></p>
 <div id="cvbox" class="sch"></div>
 <div id="props" class="actions"></div>
 <p id="compte" style="margin:6px 0;font-weight:600;color:var(--o)"></p>
 <div class="actions"><button id="suiv" class="add big"></button></div>
 <div id="opts" class="actions opts noprint">
  <button id="undo" title="Ctrl+Z">↶ Annuler</button><button id="redo" title="Ctrl+Y">↷ Rétablir</button>
  <select id="fond" title="Fond du schéma"><option value="">Terrain simple</option><option value="demi">Demi-terrain (cage en haut)</option></select> <span>Dimensions <input id="dw" type="number" min="2" value="30" style="width:64px"> × <input id="dh" type="number" min="2" value="20" style="width:64px"> m</span>
  <button onclick="tourner()" title="Tourne tout le schéma d'un quart de tour, mouvements compris">↻ Tourner le schéma</button><button onclick="miroir()" title="Inverse la gauche et la droite, mouvements compris">⇋ Miroir</button><button id="nouveau">Nouveau schéma</button><button id="clear">Tout effacer</button><button id="dlsvg">Télécharger l'image</button>
 </div>
</section>
<dialog id="dlgc"><div class="form">
 <h3>Enregistrer <span id="c_titre"></span></h3>
 <button id="c_rempl" class="add big"></button>
 <button id="c_var" class="big">⧉ Enregistrer comme nouvelle variante</button>
 <button class="big" onclick="dlgc.close()">Annuler</button>
</div></dialog>
<dialog id="dlgv"><form id="fdlgv" method="dialog" class="form">
 <h3>Variante de « <span id="v_parent"></span> »</h3>
 <label>Nom de la variante <input id="v_nom" maxlength="40" required placeholder="ex. 2 touches maximum"></label>
 <label>Ce qui change <textarea id="v_change" rows="3" required placeholder="ex. Les joueurs ont 2 touches de balle au maximum."></textarea></label>
 <label>Difficulté <span class="chips"><label class="chip"><input type="radio" name="v_diff" value="plus facile"> Plus facile</label><label class="chip"><input type="radio" name="v_diff" value="plus difficile"> Plus difficile</label><label class="chip"><input type="radio" name="v_diff" value="" checked> Autre</label></span></label>
 <label>Durée si elle change (min) <input id="v_duree" type="number" min="1" placeholder="même durée"></label>
 <div class="actions"><button type="submit" class="add">Enregistrer la variante</button><button type="button" onclick="dlgv.close()">Annuler</button></div>
</form></dialog>
<dialog id="dlg"><form id="fdlg" method="dialog" class="form">
 <h3>Fiche d'exercice</h3>
 <label>Titre (40 car.) <input id="f_titre" maxlength="40" required></label>
 <label>Thème <select id="f_theme"><option>échauffement</option><option>technique</option><option>conduite</option><option>passe</option><option>tir</option><option>jeu réduit</option><option>tactique</option><option>physique</option><option>gardien</option><option>retour au calme</option></select></label>
 <label>Catégories <span id="f_cats" class="chips"></span></label>
 <label>Niveau <select id="f_niveau"><option>débutant</option><option>confirmé</option></select></label>
 <label>Durée (min) <input id="f_duree" type="number" min="1"></label>
 <label>Joueurs min / max <span><input id="f_jmin" type="number" min="1" style="width:70px"> <input id="f_jmax" type="number" min="1" style="width:70px"></span></label>
 <label>Matériel (rempli d'après le schéma, modifiable) <input id="f_mat"></label>
 <label>Objectif <textarea id="f_obj" rows="2"></textarea></label>
 <label>Organisation <textarea id="f_org" rows="2"></textarea></label>
 <label>Déroulement <textarea id="f_dero" rows="3"></textarea></label>
 <label>Consignes (une par ligne) <textarea id="f_cons" rows="3"></textarea></label>
 <label>Variantes (« nom : ce qui change », une par ligne) <textarea id="f_var" rows="3"></textarea></label>
 <div class="actions"><button type="submit" class="add">Enregistrer</button><button type="button" id="cancel">Annuler</button></div>
</form></dialog>
</main>
<script src="data.js?v=7"></script><script>window.EXERCICES=window.EXERCICES||[]</script>
<script>
let UID=0;
function uniq2(svg){const n='m'+(++UID)+'_';return svg.replace(/id="(?:m\d+_)?(ap|ad|ag|ar)"/g,'id="'+n+'$1"').replace(/url\(#(?:m\d+_)?(ap|ad|ag|ar)\)/g,'url(#'+n+'$1)')}
// Comptage automatique des joueurs et du matériel à partir du schéma
const NOMMAT={ballon:['ballon','ballons'],plot:['plot','plots'],piquet:['piquet','piquets'],mannequin:['mannequin','mannequins'],haie:['haie','haies'],cerceau:['cerceau','cerceaux'],echelle:['échelle de rythme','échelles de rythme'],but:['but','buts'],chasuble:['chasuble','chasubles']};
function compte(m){const I=(m&&m.items)||[],c={},add=(k,n=1)=>{c[k]=(c[k]||0)+n};let pb=0,pr=0,pj=0;
 I.forEach(i=>{if(i.t=='p'){i.c=='r'?pr++:i.c=='j'?pj++:pb++}else if(i.t=='ball')add('ballon');else if(NOMMAT[i.t])add(i.t)});
 const ch=(pb&&pr?pr:0)+pj;if(ch)add('chasuble',ch);return{joueurs:pb+pr+pj,mat:c}}
const nomMat=(k,q)=>NOMMAT[k]?NOMMAT[k][q>1?1:0]:k;
function matListe(e){if(e.schema_modele){const k=compte(e.schema_modele);return Object.entries(k.mat).map(([n,q])=>({cle:n,nom:nomMat(n,q),quantite:q}))}return e.materiel}
const txtMat=l=>l.length?l.map(m=>m.quantite+' '+esc(m.nom)).join(', '):'aucun';
let E=window.EXERCICES;const $=s=>document.querySelector(s);
let S=[];try{S=JSON.parse(localStorage.getItem('seance')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('seance',JSON.stringify(S))}catch(e){}$('#cnt').textContent=S.length};
const ordreTheme=a=>{const o=['échauffement','physique','technique','tactique','jeu réduit'],r=x=>o.indexOf(x)<0?99:o.indexOf(x);return a.sort((x,y)=>r(x)-r(y))};
const OPENS={},dB=e=>[10,15,20,30].reduce((a,b)=>Math.abs(b-e.duree_min)<Math.abs(a-e.duree_min)?b:a);
const uniq=a=>[...new Set(a)].sort();
let F={theme:'',cat:'U15',duree:'',niveau:'',auteur:''};
function majFiltres(){
 const grp=(titre,cle,vals,fmt)=>`<details ${OPENS[titre]===undefined?(titre=='Catégorie'?'':'open'):(OPENS[titre]?'open':'')} ontoggle="OPENS['${titre}']=this.open"><summary>${titre}</summary>${vals.map(v=>`<button class="fo${F[cle]==v?' on':''}" onclick="setF('${cle}','${v}')">${fmt?fmt(v):esc(v)} <small>${E.filter(e=>ok(e,{...F,[cle]:v})).length}</small></button>`).join('')}</details>`;
 $('#side').innerHTML=`<input id="q" placeholder="Rechercher…" value="${esc(($('#q')||{}).value||'')}">`+(uniq(E.map(e=>e.auteur).filter(Boolean)).length?grp('Entraîneur','auteur',uniq(E.map(e=>e.auteur).filter(Boolean))):'')+grp('Thème','theme',ordreTheme(uniq(E.map(e=>e.theme))))+grp('Catégorie','cat',uniq(E.flatMap(e=>e.categories)))+grp('Durée','duree',['10','15','20','30'],v=>'≈ '+v+' min')+grp('Niveau','niveau',uniq(E.map(e=>e.niveau)))+'<button class="fo" onclick="F={theme:\'\',cat:\'\',duree:\'\',niveau:\'\',auteur:\'\'};$(\'#q\').value=\'\';majFiltres();base()">↺ Tout afficher</button>';
 $('#q').oninput=()=>{const q=$('#q'),pos=q.selectionStart;majFiltres();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);base()}}
function setF(k,v){F[k]=F[k]==v?'':v;majFiltres();base()}

const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fiche(e,v){return `<div class="fiche"><h3><span class="min">${v&&v.duree||e.duree_min}'</span>${esc(e.titre)}</h3>
<div class="tags">${e.club?(e.auteur?`<span class="tclub">${esc(e.auteur)}</span>`:''):(e.auteur?`<span class="tclub">${esc(e.auteur)}</span>`:'')}${e.perso?'<span class="tperso">Sur cet appareil</span>':''}${(e.mots_cles&&e.mots_cles.length?e.mots_cles:[e.theme]).map(m=>`<span>${esc(m)}</span>`).join('')}</div>
${schemas(e,v)}${e.schema_modele?`<h4>Sur le schéma</h4><p><b>${compte(e.schema_modele).joueurs} joueurs</b> · ${txtMat(matListe(e))}</p>`:`<h4>Matériel</h4><p>${txtMat(e.materiel)}</p>`}
<h4>Objectif</h4><p>${esc(e.objectif)}</p>
<h4>Organisation</h4><p>${esc(e.organisation)}</p>
<h4>Déroulement</h4><p>${esc(e.deroulement)}</p>
<h4>Consignes</h4><ul>${e.consignes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
<details ${v&&v.variante!=null?'open':''}><summary>Variantes</summary><ul>${e.variantes.map(x=>`<li><b>${esc(x.nom)}</b> ${x.difficulte?'('+esc(x.difficulte)+') ':''}${x.duree?'· '+x.duree+' min ':''}: ${esc(x.change)}${x.schema_modele?' <small>(schéma)</small>':''}</li>`).join('')}</ul></details>`}
// Schémas : en base, l'exercice et ses variantes côte à côte ; en séance, seulement la version choisie.
function schemas(e,v){const vs=(e.variantes||[]).map((x,k)=>({...x,k})).filter(x=>x.schema_svg);
 const fig=(svg,nom,tag,k)=>`<figure class="sch${v&&v.variante==nom&&k!=null?' on':''}">${nom?`<figcaption><b>${esc(nom)}</b>${tag?` <span class="vt">${esc(tag)}</span>`:''}</figcaption>`:''}${uniq2(svg)}<div class="actions noprint"><button class="pl" onclick="anim(this)">⏸ Pause</button>${!v&&k!=null?`<button class="pl add" onclick="ajouter('${e.id}',${k})">+ Séance</button>${e.schema_modele?`<button class="pl" onclick="modifierVariante('${e.id}',${k})">✎ Modifier</button>`:''}`:''}</div></figure>`;
 if(v){const c=vs.find(x=>x.nom==v.variante);return c?`<div class="schs">${fig(c.schema_svg,'Variante : '+c.nom,c.difficulte,c.k)}</div>`:e.schema_svg?`<div class="schs">${fig(e.schema_svg,'Exercice de base','')}</div>`:''}
 if(!e.schema_svg)return'';return `<div class="schs${vs.length?' multi':''}">${fig(e.schema_svg,vs.length?'Exercice de base':'',vs.length?'':'')}${vs.map(x=>fig(x.schema_svg,x.nom,x.difficulte,x.k)).join('')}</div>`}
function ok(e,f){const q=(($('#q')||{}).value||'').toLowerCase();return(!f.theme||e.theme==f.theme)&&(!f.cat||e.categories.includes(f.cat))&&(!f.duree||dB(e)==+f.duree)&&(!f.niveau||e.niveau==f.niveau)&&(!f.auteur||e.auteur==f.auteur)&&(!q||JSON.stringify(e).toLowerCase().includes(q))}
function base(){const q=$('#q').value.toLowerCase();
 const r=E.filter(e=>ok(e,F));
 window.AFF=r;$('#liste').innerHTML=r.length?r.map(e=>fiche(e)+`<div class="actions"><button class="add" onclick="ajouter('${e.id}')">+ Ajouter à la séance</button>${e.schema_modele?`<button onclick="modifierSchema('${e.id}')">Modifier</button><button onclick="nouvelleVariante('${e.id}')">⧉ Créer une variante</button>`:''}<button onclick="exporterFiche('${e.id}')">Exporter (JSON)</button>${e.perso?`<button onclick="supprimerPerso('${e.id}')">${aOrig(e.id)?'Rétablir l\'original':'Supprimer'}</button>`:''}${window.boutonsClub?boutonsClub(e):''}</div></div>`).join(''):'<div class="vide">Aucun exercice.</div>'}
function ajouter(id,k){const e=E.find(x=>x.id==id),x=k!=null&&e.variantes[k];S.push({id,duree:x&&x.duree||e.duree_min,variante:x?x.nom:''});save();seance();const b=event&&event.target;if(b&&b.tagName=='BUTTON'){const t=b.textContent;b.textContent='✓ Ajouté';setTimeout(()=>b.textContent=t,1200)}}
const noFiche=id=>`<div class="fiche"><h3>Fiche introuvable (${esc(id)})</h3><p>Elle n'est pas (ou plus) dans la base du club.</p></div>`;
let TERRAIN=false,TM={},TMI=null;
const tmRest=(i,d)=>{const t=TM[i];if(!t)return d*60;return t.run?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.rest};
const tmTxt=(i,d)=>{const r=tmRest(i,d);return TM[i]?(r<=0?'Terminé':Math.floor(r/60)+':'+String(r%60).padStart(2,'0')):d+"'"};
function tmHtml(i,d){const t=TM[i],r=tmRest(i,d),fin=t&&r<=0;return `<div class="timer${fin?' fin':''}" id="tm${i}"><b>${fin?'Terminé !':Math.floor(r/60)+':'+String(r%60).padStart(2,'0')}</b><button onclick="tmGo(${i})">${t&&t.run?'⏸ Pause':fin?'↻ Relancer':'▶ Démarrer'}</button><button onclick="tmRaz(${i})">↺</button></div>`}
function tmGo(i){const d=+S[i].duree,t=TM[i];tmAudio();
 if(t&&t.run){t.rest=tmRest(i,d);t.run=false}else{const r=tmRest(i,d);TM[i]={run:true,end:Date.now()+(r<=0?d*60:r)*1000,rest:0,bip:false}}
 tmRender(i);if(!TMI)TMI=setInterval(tmTick,500);try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
function tmRaz(i){delete TM[i];tmRender(i)}
function tmRender(i){const el=document.getElementById('tm'+i);if(el)el.outerHTML=tmHtml(i,+S[i].duree);const d=document.getElementById('td'+i);if(d)d.textContent=tmTxt(i,+S[i].duree)}
function tmTick(){let run=false;Object.keys(TM).forEach(i=>{const t=TM[i];if(!t.run)return;const r=tmRest(i,+S[i].duree);
  if(r<=0&&!t.bip){t.bip=true;t.run=false;t.rest=0;tmBip();tmRender(i)}else{run=true;const b=document.querySelector('#tm'+i+' b'),d=document.getElementById('td'+i),x=tmTxt(i,+S[i].duree);if(b)b.textContent=x;if(d)d.textContent=x}});
 if(!run){clearInterval(TMI);TMI=null}}
let AC=null;
function tmAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function tmBip(){try{navigator.vibrate&&navigator.vibrate([500,200,500,200,500,200,500])}catch(e){}
 try{tmAudio();if(!AC)return;const t0=AC.currentTime;for(let k=0;k<8;k++)[880,1175].forEach((f,j)=>{const t=t0+k*.7+j*.25,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.25)})}catch(e){}}
function seance(){save();$('#nom').value=localStorage.getItem('nomseance')||$('#nom').value;$('#dat').value=localStorage.getItem('dateseance')||$('#dat').value;
 $('#seance').classList.toggle('terrain',TERRAIN);$('#mt').textContent=TERRAIN?'✏️ Mode édition':'📱 Mode terrain';
 const tot=S.reduce((a,s)=>a+ +s.duree,0),mat={};
 let jmax=0;S.forEach(s=>{const e=E.find(e=>e.id==s.id);if(!e)return;if(e.schema_modele)jmax=Math.max(jmax,compte(e.schema_modele).joueurs);matListe(e).forEach(m=>{const k=m.cle||m.nom;mat[k]=Math.max(mat[k]||0,m.quantite)})});
 $('#tot').innerHTML=`<ol style="margin:0 0 8px;padding-left:20px">${S.map(s=>{const e=E.find(x=>x.id==s.id);return e?`<li>${esc(e.titre)} <small>(${e.theme}${s.variante?' · '+esc(s.variante):''}) · ${s.duree} min</small></li>`:''}).join('')}</ol>Durée totale : ${tot} min<br>Joueurs (schéma le plus grand) : ${jmax||'—'}<br>Matériel à prévoir : ${Object.entries(mat).map(([k,v])=>v+' '+esc(nomMat(k,v))).join(', ')||'—'}`;
 $('#sl').innerHTML=S.length?S.map((s,i)=>{const e=E.find(x=>x.id==s.id);
 if(!e)return noFiche(s.id);
 if(TERRAIN)return `<details class="tstep"${i==0?' open':''}><summary>${i+1} · ${esc(e.titre)}<span class="d" id="td${i}">${tmTxt(i,s.duree)}</span></summary>${tmHtml(i,s.duree)}${fiche(e,{duree:s.duree,variante:s.variante||null})}${s.variante?`<p style="padding:0 12px 12px"><b>Variante choisie :</b> ${esc(s.variante)}</p>`:''}</details>`;
 return fiche(e,{duree:s.duree,variante:s.variante||null})+`<div class="actions noprint"><button onclick="mv(${i},-1)">▲</button><button onclick="mv(${i},1)">▼</button>
 Durée <input type="number" min="1" value="${s.duree}" style="width:70px" onchange="S[${i}].duree=this.value;seance()"> min
 <select onchange="S[${i}].variante=this.value;const x=e.variantes.find(y=>y.nom==this.value);if(x&&x.duree)S[${i}].duree=x.duree;seance()"><option value="">Variante…</option>${e.variantes.map(x=>`<option ${s.variante==x.nom?'selected':''}>${esc(x.nom)}</option>`).join('')}</select>
 <button onclick="S.splice(${i},1);seance()">Retirer</button></div>${s.variante?`<p><b>Variante choisie :</b> ${esc(s.variante)}</p>`:''}</div>`}).join(''):'<div class="vide">Séance vide : ajoute des exercices depuis la base.</div>'}
function anim(b){const v=b.closest('figure,.sch').querySelector('svg');if(b.dataset.p){v.unpauseAnimations();b.textContent='⏸ Pause';delete b.dataset.p}else{v.pauseAnimations();b.textContent='▶ Lecture';b.dataset.p=1}}
function mv(i,d){const j=i+d;if(j<0||j>=S.length)return;[S[i],S[j]]=[S[j],S[i]];seance()}
function show(s){$('#editeur').classList.toggle('hide',s!='e');ne.className=s=='e'?'on':'';$('#base').classList.toggle('hide',s!='b');$('#seance').classList.toggle('hide',s!='s');$('#seances').classList.toggle('hide',s!='l');nl.className=s=='l'?'on':'';nb.className=s=='b'?'on':'';ns.className=s=='s'?'on':'';if(s=='s')seance();if(s=='l'&&window.seancesCharger)seancesAff()}

function faireSeance(){let d=document.getElementById('fsd');if(d)d.remove();d=document.createElement('dialog');d.id='fsd';d.style.cssText='max-width:820px;width:96vw;max-height:92vh;overflow:auto;border:0;border-radius:10px;padding:16px;background:#f4f6fa';
 const pool=E.filter(e=>!F.cat||e.categories.includes(F.cat)),ths=ordreTheme(uniq(pool.map(e=>e.theme))),cat=F.cat?'Catégorie '+esc(F.cat)+' · ':'';
 document.body.appendChild(d);
 d.innerHTML='<h3 style="margin:0 0 4px">Faire une séance · 1/2</h3><p style="margin:0 0 10px;color:#666;font-size:14px">'+cat+'Quels thèmes veux-tu dans la séance ?</p>'+ths.map((t,i)=>'<label style="display:block;margin:6px 0;font-size:16px"><input type="checkbox" value="'+i+'"> '+esc(t)+' <small style="color:#888">('+pool.filter(e=>e.theme==t).length+' fiches)</small></label>').join('')+'<div style="margin-top:12px;text-align:right"><button id="fsx">Annuler</button> <button class="add" id="fsok">Choisir les fiches →</button></div>';
 d.querySelector('#fsx').onclick=()=>d.close();
 d.querySelector('#fsok').onclick=()=>{const ch=[...d.querySelectorAll('input:checked')].map(x=>ths[+x.value]);if(!ch.length){alert('Coche au moins un thème.');return}
  let k=0;const etape=()=>{const t=ch[k],last=k==ch.length-1,L=pool.filter(e=>e.theme==t);
   d.innerHTML='<div style="position:sticky;top:-16px;background:#f4f6fa;padding:8px 0;z-index:2"><b>Thème '+(k+1)+'/'+ch.length+' : '+esc(t)+'</b> <button id="fsb">'+(k?'← Précédent':'← Thèmes')+'</button> <button class="add" id="fsf">'+(last?'Terminer (voir la séance)':'Suivant →')+'</button><br><input id="fsq" placeholder="Mots-clés (ex. passe, 3 contre 1, plots)…" style="margin-top:6px;width:100%;padding:6px;box-sizing:border-box"></div><div id="fsl"></div>';
   const aff=()=>{const m=d.querySelector('#fsq').value.toLowerCase().split(/\s+/).filter(Boolean),r=L.filter(e=>{const h=JSON.stringify(e).toLowerCase();return m.every(w=>h.includes(w))});
    d.querySelector('#fsl').innerHTML=r.length?r.map(e=>fiche(e)+'<div class="actions"><button class="add" onclick="ajouter(\''+e.id+'\')">+ Ajouter à la séance</button></div></div>').join(''):'<p class="vide">Aucune fiche pour ces mots-clés.</p>'};
   aff();d.querySelector('#fsq').oninput=aff;
   d.scrollTop=0;d.querySelector('#fsb').onclick=()=>{if(k){k--;etape()}else faireSeance()};d.querySelector('#fsf').onclick=()=>{if(last){d.close();show('s')}else{k++;etape()}}};etape()};d.showModal()}
nf.onclick=faireSeance;
ne.onclick=()=>show('e');nl.onclick=()=>show('l');mt.onclick=()=>{TERRAIN=!TERRAIN;TM={};seance()};nb.onclick=()=>show('b');ns.onclick=()=>show('s');

nom.oninput=()=>{try{localStorage.setItem('nomseance',nom.value)}catch(e){}};dat.oninput=()=>{try{localStorage.setItem('dateseance',dat.value)}catch(e){}};
cln.onclick=()=>{if(!S.length){alert('La séance est vide.');return}const n=(nom.value||'Séance').replace(/^Copie de /,'');nom.value='Copie de '+n;dat.value='';['seanceid'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});lsS('nomseance',nom.value);lsS('dateseance','');seance();scrollTo(0,0);alert('Nouvelle séance créée à partir de celle-ci : change le nom et la date, puis enregistre.')};
raz.onclick=()=>{if(confirm('Vider la séance ?')){S=[];nom.value='';dat.value='';['nomseance','dateseance','seanceid'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});seance()}};
exp.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({nom:nom.value,exercices:S})],{type:'application/json'}));a.download=(nom.value||'seance').replace(/[^a-z0-9_-]/gi,'_')+'.json';a.click()};
imp.onchange=()=>{const f=imp.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);S=d.exercices||[];nom.value=d.nom||'';seance()})};
majFiltres();base();save();
</script>
